<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Email</title>
    <style>
        @media screen and (max-width: 760px) {
            .header, .main-content {
                display: block;
                width: 100% !important;
            }
            .logo-container, .logo-image {
                text-align: center !important;
            }
            .separator {
                display: none;
            }
            .text-center {
                text-align: center !important;
            }
        }

    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center;">
<table width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f4f4f4" style="height: 100%;">
    <tr>
        <td align="center" valign="middle" style="height: 100%;">
            <table cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="margin: 20px 0; width: 100%;  max-width: 760px;">
                <!-- Header -->
                <tr>
                    <td class="header" style="background-color: #000000; color: #ffffff; font-size: 16px; text-align: left;">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <!-- Section gauche -->
                                <td class="logo-container" style="width: 40%; text-align: center; background: url('STONE.svg') center center/cover no-repeat; height: 100px;">
                                    <a href="https://www.easyplandetravail.com" style="color: #ffffff; text-decoration: none; font-size: 14px;">https://www.easyplandetravail.com</a>
                                </td>
                                <!-- Section droite -->
                                <td class="logo-image" style="width: 60%; text-align: right; padding-right: 20px;">
                                    <img src="LOGO_GROUP.svg" alt="Logo" style="max-width: 100%; height: auto;">
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Main Content -->
                <tr>
                    <td class="main-content" style="padding: 40px 20px;">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <!-- Colonne gauche -->
                                <td style="display: flex; text-align: center; padding: 10px; height: 100px;">
                                    <img src="logo_stacked.svg" alt="CB Surfaces Logo" style="max-width: 100%; height: auto;">
                                </td>


                                <!-- Ligne de séparation -->
                                <td class="separator" style="width: 1px; background-color: #cccccc; transform: translateY(-66px)"></td>

                                <!-- Colonne droite -->
                                <td style="width: 59%; text-align: left; padding: 0px 25px;">
                                    <table width="100%" cellspacing="0" cellpadding="0" border="0">
                                        <tr style="margin-bottom: 10px">
                                            <td style="width: 50%; padding-right: 10px; padding-bottom: 12px;vertical-align: top;">
                                                <h2 style="font-size: 20px; font-weight: bold; margin: 0;">Baptiste Pelouin</h2>
                                            </td>
                                        </tr>
                                        <tr>
                                            <!-- Première colonne -->
                                            <td style="width: 50%; padding-right: 10px; vertical-align: top;">
                                                <p style="font-size: 14px;  margin: 10px 0;">Poste</p>
                                                <p style="font-size: 14px; color: #666666; margin: 5px 0;">Directeur Général</p>
                                                <p style="font-size: 14px;  margin: 10px 0;">Adresse</p>
                                                <p style="font-size: 14px; color: #666666; margin: 5px 0;">39 Avenue de Friedland</p>
                                            </td>
                                            <!-- Deuxième colonne -->
                                            <td style="width: 50%; padding-left: 10px; vertical-align: top;">
                                                <p style="font-size: 14px; margin: 10px 0;">Email</p>
                                                <p style="font-size: 14px; color: #333333; margin: 10px 0;">
                                                    <a href="mailto:direction@cbsurfaces.com" style="color:#666666; text-decoration: none;">direction@cbsurfaces.com</a>
                                                </p>
                                                <p style="font-size: 14px; margin: 10px 0;">Mobile</p>
                                                <p style="font-size: 14px; color: #666666; margin: 5px 0;">+33 6 25 05 31 83</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>

                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
